<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Iniciar Sesión</h2>
      <p>Sistema Integrado - INDECI</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="codUsuario">Usuario</label>
        <input
          id="codUsuario"
          type="text"
          formControlName="codUsuario"
          placeholder="Ingrese su usuario"
        />
        <div *ngIf="loginForm.get('codUsuario')?.invalid && loginForm.get('codUsuario')?.touched" class="error-text">
          El usuario es requerido.
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Ingrese su contraseña"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          La contraseña es requerida.
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        {{ isLoading ? 'Ingresando...' : 'Acceder' }}
      </button>
    </form>
  </div>
</div>
